name: Lint

on:
  push:
    branches: [main, initial-app-setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          src: server/app
          args: check

      - uses: astral-sh/ruff-action@v3
        with:
          src: server/app
          args: format --check

  eslint-mobile:
    name: ESLint (mobile)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/mobile/package.json') != '' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
