name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          src: server/app server/scripts server/tests
          args: check

      - uses: astral-sh/ruff-action@v3
        with:
          src: server/app server/scripts server/tests
          args: format --check

  unit-tests-server-run:
    name: Run unit tests (server)
    runs-on: ubuntu-latest
    outputs:
      title_suffix: ${{ steps.pytest.outputs.title_suffix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        id: pytest
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest.log
          PASSED=$(grep -E '[0-9]+ passed' pytest.log | tail -1 | grep -oE '[0-9]+' | head -1)
          if [ -z "$PASSED" ]; then
            echo "::error::Could not parse pytest passed count"
            exit 1
          fi
          echo "title_suffix=${PASSED} passed" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests (server · ${{ needs.unit-tests-server-run.outputs.title_suffix }})
    needs: unit-tests-server-run
    runs-on: ubuntu-latest
    if: always() && needs.unit-tests-server-run.result != 'cancelled'
    steps:
      - name: Require pytest success
        run: test "${{ needs.unit-tests-server-run.result }}" = "success"

  eslint-mobile:
    name: ESLint (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for mobile app
        id: mobile
        shell: bash
        run: |
          if [ -f apps/mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mobile.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        if: steps.mobile.outputs.present == 'true'
        working-directory: apps/mobile
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: ESLint
        if: steps.mobile.outputs.present == 'true'
        working-directory: apps/mobile
        run: npm run lint

      - name: Typecheck
        if: steps.mobile.outputs.present == 'true'
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Skip (no mobile app yet)
        if: steps.mobile.outputs.present != 'true'
        run: echo "apps/mobile/package.json not found — skipping ESLint"

  unit-tests-mobile-run:
    name: Run unit tests (mobile)
    runs-on: ubuntu-latest
    outputs:
      title_suffix: ${{ steps.jest.outputs.title_suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for mobile app
        id: mobile
        shell: bash
        run: |
          if [ -f apps/mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mobile.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        if: steps.mobile.outputs.present == 'true'
        working-directory: apps/mobile
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run Jest or skip
        id: jest
        shell: bash
        run: |
          if [ "${{ steps.mobile.outputs.present }}" != "true" ]; then
            echo "title_suffix=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd apps/mobile
          set -o pipefail
          npm test -- --ci --json --outputFile=jest-results.json
          PASSED=$(node -p "require('./jest-results.json').numPassedTests")
          echo "title_suffix=${PASSED} passed" >> "$GITHUB_OUTPUT"

  unit-tests-mobile:
    name: Unit tests (mobile · ${{ needs.unit-tests-mobile-run.outputs.title_suffix }})
    needs: unit-tests-mobile-run
    runs-on: ubuntu-latest
    if: always() && needs.unit-tests-mobile-run.result != 'cancelled'
    steps:
      - name: Require Jest success
        run: test "${{ needs.unit-tests-mobile-run.result }}" = "success"
