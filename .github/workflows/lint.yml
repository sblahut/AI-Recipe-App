name: Lint

on:
  push:
    branches: [main, initial-app-setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          src: server/app
          args: check

      - uses: astral-sh/ruff-action@v3
        with:
          src: server/app
          args: format --check

  eslint-mobile:
    name: ESLint (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for mobile app
        id: mobile
        shell: bash
        run: |
          if [ -f apps/mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mobile.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        if: steps.mobile.outputs.present == 'true'
        working-directory: apps/mobile
        run: npm ci

      - name: ESLint
        if: steps.mobile.outputs.present == 'true'
        working-directory: apps/mobile
        run: npm run lint

      - name: Skip (no mobile app yet)
        if: steps.mobile.outputs.present != 'true'
        run: echo "apps/mobile/package.json not found — skipping ESLint"
