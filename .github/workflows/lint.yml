name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          src: server/app server/scripts server/tests
          args: check

      - uses: astral-sh/ruff-action@v3
        with:
          src: server/app server/scripts server/tests
          args: format --check

  unit-tests:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: server
        run: python -m pytest tests -q

  eslint-mobile:
    name: ESLint (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for mobile app
        id: mobile
        shell: bash
        run: |
          if [ -f apps/mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mobile.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        if: steps.mobile.outputs.present == 'true'
        working-directory: apps/mobile
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: ESLint
        if: steps.mobile.outputs.present == 'true'
        working-directory: apps/mobile
        run: npm run lint

      - name: Skip (no mobile app yet)
        if: steps.mobile.outputs.present != 'true'
        run: echo "apps/mobile/package.json not found — skipping ESLint"
